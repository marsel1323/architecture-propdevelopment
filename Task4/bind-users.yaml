---

# Finance-team → finance-isolator (namespace role)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-finance
  namespace: finance
subjects:
  - kind: User
    name: finance-user
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: finance-isolator
  apiGroup: rbac.authorization.k8s.io

---

# Support → support-reader (namespace role)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-support
  namespace: production
subjects:
  - kind: User
    name: support-user
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: support-reader
  apiGroup: rbac.authorization.k8s.io